name: Tests

permissions:
  contents: read

on: [push, pull_request]

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: [7.4, 8.0, 8.1, 8.2, 8.3, 8.4]
        experimental: [false]
        composer-options: ['']
        include:
          - php: 8.2
            analysis: true
          - php: 8.5
